<section class="form-section">



<div class="form-box">



<h2>Customer Registration</h2>



<form id="registerForm">



<input

type="text"

id="name"

placeholder="Full Name"

required>



<input

type="text"

id="username"

placeholder="Username"

required>



<input

type="text"

id="phone"

placeholder="Phone Number"

required>



<input

type="password"

id="password"

placeholder="Password"

required>



<button type="submit">



Register



</button>



</form>



<p>



Already have an account?



<a href="login.html">

</a>



</p>
