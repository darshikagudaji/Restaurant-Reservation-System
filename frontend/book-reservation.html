<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book a Table - Food Palace</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<!-- =====================================================
     HEADER
====================================================== -->

<header>

    <div class="logo">

        <h2>🍽 Food Palace</h2>

    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="mybookings.html">
            My Bookings
        </a>

        <a
            href="index.html"
            id="logoutBtn"
        >
            Logout
        </a>

    </nav>

</header>


<!-- =====================================================
     RESERVATION SECTION
====================================================== -->

<section class="form-section">

    <div class="form-box">

        <!-- This heading changes when rescheduling -->

        <h2 id="reservationTitle">
            Reserve A Table
        </h2>


        <!-- =================================================
             RESERVATION FORM
        ================================================== -->

        <form id="reservationForm">


            <!-- CUSTOMER NAME -->

            <input
                type="text"
                id="customerName"
                placeholder="Customer Name"
                required
            >


            <!-- PHONE -->

            <input
                type="text"
                id="phone"
                placeholder="Phone Number"
                required
            >


            <!-- NUMBER OF GUESTS -->

            <input
                type="number"
                id="guests"
                placeholder="Number of Guests"
                min="1"
                max="8"
                required
            >


            <!-- TABLE -->

            <select
                id="tableNumber"
                required
            >

                <option value="">
                    Select Suitable Table
                </option>

            </select>


            <!-- DATE -->

            <input
                type="date"
                id="reservationDate"
                required
            >


            <!-- TIME -->

            <input
                type="time"
                id="reservationTime"
                required
            >


            <!-- =================================================
                 NORMAL BOOKING / RESCHEDULE BUTTON
            ================================================== -->

            <button
                type="submit"
                id="reservationSubmitBtn"
            >
                Confirm Reservation
            </button>


            <!-- =================================================
                 CANCEL RESCHEDULE
            ================================================== -->

            <button
                type="button"
                id="cancelRescheduleBtn"
                style="display:none;"
            >
                Cancel Reschedule
            </button>


        </form>

    </div>

</section>


<!-- =====================================================
     TOAST MESSAGE
====================================================== -->

<div
    id="toast"
    class="toast"
></div>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="js/app.js"></script>

</body>

</html>
