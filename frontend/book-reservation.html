<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Table - Food Palace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">
        <h2>🍽 Food Palace</h2>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="mybookings.html">My Bookings</a>
        <a href="index.html" id="logoutBtn">Logout</a>
    </nav>
</header>

<section class="form-section">

    <div class="form-box">

        <h2>Reserve A Table</h2>

       <form id="reservationForm">

    <input
        type="text"
        id="customerName"
        placeholder="Customer Name"
        required
    >

    <input
        type="text"
        id="phone"
        placeholder="Phone Number"
        required
    >

    <input
        type="number"
        id="guests"
        placeholder="Number of Guests"
        min="1"
        max="8"
        required
    >

    <select id="tableNumber" required>
        <option value="">Select Suitable Table</option>
    </select>

    <input
        type="date"
        id="reservationDate"
        required
    >

    <input
        type="time"
        id="reservationTime"
        required
    >

    <button type="submit">
        Confirm Reservation
    </button>

</form>
    </div>

</section>

<div id="toast" class="toast"></div>

<script src="js/app.js"></script>

</body>
</html>
